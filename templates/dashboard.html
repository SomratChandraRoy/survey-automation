<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-label {
            font-weight: 600;
            color: #555;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status.running {
            background: #28a745;
            color: white;
        }

        .status.stopped {
            background: #dc3545;
            color: white;
        }

        .logs {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85em;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(118, 75, 162, 0.4);
        }

        .timestamp {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 Survey Automation Dashboard</h1>

        <div class="dashboard">
            <div class="card">
                <h2>📊 Statistics</h2>
                <div class="stat">
                    <span class="stat-label">Surveys Completed</span>
                    <span class="stat-value" id="surveys-completed">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Surveys Failed</span>
                    <span class="stat-value" id="surveys-failed">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">CAPTCHAs Solved</span>
                    <span class="stat-value" id="captchas-solved">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Status</span>
                    <span class="status running" id="status">Running</span>
                </div>
            </div>

            <div class="card">
                <h2>💻 System Resources</h2>
                <div class="stat">
                    <span class="stat-label">CPU Usage</span>
                    <span class="stat-value" id="cpu-usage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-bar" style="width: 0%">0%</div>
                </div>

                <div class="stat">
                    <span class="stat-label">Memory Usage</span>
                    <span class="stat-value" id="memory-usage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="memory-bar" style="width: 0%">0%</div>
                </div>

                <div class="stat">
                    <span class="stat-label">Disk Usage</span>
                    <span class="stat-value" id="disk-usage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="disk-bar" style="width: 0%">0%</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📝 Recent Logs</h2>
            <div class="logs" id="logs">
                <div class="log-entry">Loading logs...</div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh Data</button>
        </div>

        <div class="timestamp" id="timestamp">Last updated: --</div>
    </div>

    <script>
        function updateStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('surveys-completed').textContent = data.surveys_completed || 0;
                    document.getElementById('surveys-failed').textContent = data.surveys_failed || 0;
                    document.getElementById('captchas-solved').textContent = data.captchas_solved || 0;
                })
                .catch(error => console.error('Error fetching stats:', error));
        }

        function updateSystem() {
            fetch('/api/system')
                .then(response => response.json())
                .then(data => {
                    const cpu = Math.round(data.cpu_percent || 0);
                    const memory = Math.round(data.memory_percent || 0);
                    const disk = Math.round(data.disk_percent || 0);

                    document.getElementById('cpu-usage').textContent = cpu + '%';
                    document.getElementById('cpu-bar').style.width = cpu + '%';
                    document.getElementById('cpu-bar').textContent = cpu + '%';

                    document.getElementById('memory-usage').textContent = memory + '%';
                    document.getElementById('memory-bar').style.width = memory + '%';
                    document.getElementById('memory-bar').textContent = memory + '%';

                    document.getElementById('disk-usage').textContent = disk + '%';
                    document.getElementById('disk-bar').style.width = disk + '%';
                    document.getElementById('disk-bar').textContent = disk + '%';
                })
                .catch(error => console.error('Error fetching system info:', error));
        }

        function updateLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(data => {
                    const logsDiv = document.getElementById('logs');
                    logsDiv.innerHTML = '';

                    data.forEach(line => {
                        const entry = document.createElement('div');
                        entry.className = 'log-entry';
                        entry.textContent = line;
                        logsDiv.appendChild(entry);
                    });

                    logsDiv.scrollTop = logsDiv.scrollHeight;
                })
                .catch(error => console.error('Error fetching logs:', error));
        }

        function refreshData() {
            updateStats();
            updateSystem();
            updateLogs();
            document.getElementById('timestamp').textContent = 'Last updated: ' + new Date().toLocaleString();
        }

        // Initial load
        refreshData();

        // Auto-refresh every 5 seconds
        setInterval(refreshData, 5000);
    </script>
</body>

</html>
